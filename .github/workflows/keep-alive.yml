# Keeps the Render free-tier backend awake by pinging it every ~10 minutes.
#
# Render puts free web services to sleep after 15 minutes without traffic,
# and waking up takes ~50 seconds. This workflow is a free BACKUP pinger —
# GitHub may delay scheduled runs at busy times, so pair it with a dedicated
# monitor (UptimeRobot / cron-job.org, see KEEP_ALIVE.md) for best results.
#
# The /api/health endpoint does not touch the database, so this never wakes
# or bills the Neon database.
#
# Override the URL without editing this file: repo Settings → Secrets and
# variables → Actions → Variables → add BACKEND_URL.

name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allows a manual "Run workflow" button

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://aura-expense-tracker-4s7l.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$BACKEND_URL/api/health" || echo 000)
            echo "Attempt $attempt → HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::Backend did not return 200 after 3 attempts"
